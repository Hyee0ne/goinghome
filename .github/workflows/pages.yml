# main에 올리면 빌드해서 깃허브 페이지로 배포한다 (https://hyee0ne.github.io/sonkkeut-pet/)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 유기동물 공고(공공데이터)를 매시간 새로 받아 다시 배포한다
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 공고 중인 유기동물 → public/data/animals.json (키는 저장소 비밀값, 없으면 빈 목록)
      - run: npm run data:animals
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          # 받아 오지 못하면 지금 배포된 목록을 그대로 쓴다
          ANIMALS_FALLBACK_URL: https://hyee0ne.github.io/sonkkeut-pet/data/animals.json
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
