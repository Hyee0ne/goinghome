# 옛 주소(https://hyee0ne.github.io/goinghome/) → 새 주소(https://goinghome.ricecookey.com) 넘기기 (2026-10-06 Vercel로 옮김).
# 사이트 본체는 Vercel이 빌드한다 (vercel.json, scripts/vercel-build.sh). 여기서는 이미 퍼진 옛 링크가 새 주소의 같은 화면으로
# 가도록(경로·?pet= 같은 파라미터 그대로) 넘기는 작은 페이지만 GitHub Pages에 올린다.
name: Redirect old GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 넘기는 페이지 만들기
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8">
          <title>고잉홈 · 새 주소로 옮겼어요</title>
          <link rel="canonical" href="https://goinghome.ricecookey.com/">
          <meta http-equiv="refresh" content="0; url=https://goinghome.ricecookey.com/">
          <script>
            var p = location.pathname.replace(/^\/goinghome/, '') || '/';
            location.replace('https://goinghome.ricecookey.com' + p + location.search + location.hash);
          </script>
          </head><body><p>고잉홈이 새 주소로 옮겼어요: <a href="https://goinghome.ricecookey.com/">goinghome.ricecookey.com</a></p></body></html>
          HTML
          # 없는 경로(adopt.html, make.html, ?pet= 등)도 같은 페이지가 받아 넘긴다
          cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
