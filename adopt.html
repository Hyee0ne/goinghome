<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e6" />
    <!-- 앱웹(PWA): 홈 화면에 설치 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="고잉홈" />
    <!-- 공유 미리보기 (카톡·X 등). 주소와 이미지 버전은 src/site.ts에서 바꾼다. 카톡은 JPG/PNG와 절대 주소만 읽는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="고잉홈" />
    <meta property="og:title" content="가족을 기다리는 아이들 · 고잉홈" />
    <meta property="og:description" content="국가동물보호정보시스템 공고 아이들을 손끝으로 만나 보세요" />
    <meta property="og:url" content="%SITE_URL%adopt" />
    <meta property="og:image" content="%SITE_URL%og/og-800x400.jpg?v=%OG_IMAGE_VERSION%" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="국가동물보호정보시스템 공고 아이들을 손끝으로 만나 보세요" />
    <title>가족을 기다리는 아이들 · 고잉홈</title>
  </head>
  <body class="ad-page">
    <header class="reg-top">
      <a class="reg-back home-btn" href="./" aria-label="고잉홈 첫 화면으로"><span aria-hidden="true">🏠</span></a>
      <div class="reg-title">
        <p class="reg-kicker" id="ad-count">공고 중</p>
        <h1>가족을 기다리는 아이들</h1>
      </div>
    </header>

    <main class="ad-wrap">
      <div class="ad-filters">
        <div class="seg" role="radiogroup" aria-label="종류">
          <label><input type="radio" name="ad-sp" value="all" checked /><span>전체</span></label>
          <label><input type="radio" name="ad-sp" value="dog" /><span>🐶 강아지</span></label>
          <label><input type="radio" name="ad-sp" value="cat" /><span>🐱 고양이</span></label>
        </div>
        <label class="ad-region">
          <span class="sr-only">지역</span>
          <select id="ad-sido"><option value="">전국</option></select>
        </label>
      </div>
      <p class="ad-sort muted">공고가 곧 끝나는 아이부터 보여 드려요</p>

      <ul id="ad-grid" class="ad-grid"></ul>
      <p id="ad-empty" class="ad-empty" hidden></p>
      <button id="ad-more" class="btn ad-more" type="button" hidden>더 보기</button>

      <p class="ad-source muted">
        출처: 농림축산식품부 농림축산검역본부 국가동물보호정보시스템 (공공데이터포털)<br />
        <span id="ad-updated"></span>
      </p>
    </main>
    <footer class="site-footer">© 2026 <a href="https://www.ricecookey.com" target="_blank" rel="noopener">RICECookey</a>.</footer>

    <!-- 아이 자세히 -->
    <dialog id="ad-detail" class="info-sheet" aria-labelledby="ad-d-name">
      <div class="sheet-body">
        <div class="gallery">
          <div id="ad-d-slides" class="slides" tabindex="0" aria-label="사진, 옆으로 넘겨 보기"></div>
        </div>
        <button id="ad-d-close" class="sheet-close" type="button" aria-label="닫기">✕</button>
        <header class="sheet-head">
          <div>
            <h2 id="ad-d-name"></h2>
            <p id="ad-d-meta" class="sheet-meta"></p>
          </div>
        </header>
        <ul id="ad-d-tags" class="traits"></ul>
        <section id="ad-d-note-wrap">
          <h3>특징</h3>
          <p id="ad-d-note"></p>
        </section>
        <section>
          <h3>보호 정보</h3>
          <dl id="ad-d-care" class="shelter"></dl>
        </section>
      </div>
      <footer class="sheet-foot">
        <a id="ad-d-pet" class="btn ad-pet" hidden>✋ 화면 속에서 쓰다듬어 보기</a>
        <a id="ad-d-call" class="btn primary adopt">보호소에 전화로 입양 문의</a>
        <p class="muted">입양 상담은 보호소가 직접 해요. <a href="https://www.animal.go.kr" target="_blank" rel="noopener">국가동물보호정보시스템</a>에서 공고번호로도 찾을 수 있어요.</p>
      </footer>
    </dialog>
    <script type="module" src="/src/adopt.ts"></script>
  </body>
</html>
