<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e6" />
    <!-- 앱웹(PWA): 홈 화면에 설치 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="고잉홈" />
    <!-- 공유 미리보기 (카톡·X 등). 주소와 이미지 버전은 src/site.ts에서 바꾼다. 카톡은 JPG/PNG와 절대 주소만 읽는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="고잉홈" />
    <meta property="og:title" content="가족을 기다리는 아이들 · 고잉홈" />
    <meta property="og:description" content="국가동물보호정보시스템 공고 아이들을 손끝으로 만나 보세요" />
    <meta property="og:url" content="%SITE_URL%adopt" />
    <meta property="og:image" content="%SITE_URL%og/og-800x400.jpg?v=%OG_IMAGE_VERSION%" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="국가동물보호정보시스템 공고 아이들을 손끝으로 만나 보세요" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>가족을 기다리는 아이들 · 고잉홈</title>
  </head>
  <body class="ad-page">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-5.5v-1a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v5m0-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 14.5a1.6 1.6 0 0 1 2.4-2.1L8 14"/></symbol>
    </svg>
    <!-- 상단 바: 메인과 같은 로고·글자 메뉴 (페이지마다 따로 놀지 않게) -->
    <header class="topbar site-top">
      <a class="brand" href="./" aria-label="고잉홈 첫 화면"><img class="brand-logo" src="/logo-goinghome.svg" alt="고잉홈" width="81" height="30" /></a>
      <span class="topbar-sp"></span>
      <nav class="text-menu site-menu" aria-label="메뉴"><a href="./">만나기</a><a class="on" aria-current="page" href="adopt">전체 공고</a><a href="find">닮은 친구</a></nav>
    </header>

    <main class="ad-wrap">
      <div class="page-head">
        <p class="page-kicker" id="ad-count">공고 중</p>
        <h1>가족을 기다리는 아이들</h1>
      </div>
      <div class="ad-filters">
        <div class="seg" role="radiogroup" aria-label="종류">
          <label><input type="radio" name="ad-sp" value="all" checked /><span>전체</span></label>
          <label><input type="radio" name="ad-sp" value="dog" /><span>강아지</span></label>
          <label><input type="radio" name="ad-sp" value="cat" /><span>고양이</span></label>
        </div>
        <label class="ad-region">
          <span class="sr-only">지역</span>
          <select id="ad-sido"><option value="">전국</option></select>
        </label>
      </div>
      <p class="ad-sort muted">공고가 곧 끝나는 아이부터 보여 드려요</p>

      <ul id="ad-grid" class="ad-grid"></ul>
      <p id="ad-empty" class="ad-empty" hidden></p>
      <button id="ad-more" class="btn ad-more" type="button" hidden>더 보기</button>

      <p class="ad-source muted">
        출처: 농림축산식품부 농림축산검역본부 국가동물보호정보시스템 (공공데이터포털)<br />
        <span id="ad-updated"></span>
      </p>
    </main>
    <!-- 휴대폰 하단 탭바 (앱처럼). PC는 상단 글자 메뉴 -->
<nav class="tabbar" aria-label="메뉴"><a href="./"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-5.5v-1a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v5m0-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 14.5a1.6 1.6 0 0 1 2.4-2.1L8 14"/></svg><span>만나기</span></a><a href="adopt" class="on" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>전체 공고</span></a><a href="find"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><span>닮은 친구</span></a></nav>
    <footer class="site-footer">© 2026 <a href="https://www.ricecookey.com" target="_blank" rel="noopener">RICECookey</a>.</footer>

    <!-- 아이 자세히 -->
    <dialog id="ad-detail" class="info-sheet" aria-labelledby="ad-d-name">
      <div class="sheet-body">
        <div class="gallery">
          <div id="ad-d-slides" class="slides" tabindex="0" aria-label="사진, 옆으로 넘겨 보기"></div>
        </div>
        <button id="ad-d-close" class="icon-btn sheet-close" type="button" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
        <header class="sheet-head">
          <div>
            <h2 id="ad-d-name"></h2>
            <p id="ad-d-meta" class="sheet-meta"></p>
          </div>
        </header>
        <ul id="ad-d-tags" class="traits"></ul>
        <section id="ad-d-note-wrap">
          <h3>특징</h3>
          <p id="ad-d-note"></p>
        </section>
        <section>
          <h3>보호 정보</h3>
          <dl id="ad-d-care" class="shelter"></dl>
        </section>
      </div>
      <footer class="sheet-foot">
        <a id="ad-d-pet" class="pill pill-line ad-pet" hidden><svg class="ico" aria-hidden="true"><use href="#i-hand" /></svg><span>쓰다듬어 보기</span></a>
        <a id="ad-d-call" class="pill pill-primary adopt"><svg class="ico" aria-hidden="true"><use href="#i-phone" /></svg><span>입양 문의</span></a>
      </footer>
    </dialog>
    <script type="module" src="/src/adopt.ts"></script>
  </body>
</html>
