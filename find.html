<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e6" />
    <!-- 공유 미리보기 (카톡·X 등). 주소와 이미지 버전은 src/site.ts에서 바꾼다. 카톡은 JPG/PNG와 절대 주소만 읽는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="고잉홈" />
    <meta property="og:title" content="우리 아이 닮은 친구 찾기 · 고잉홈" />
    <meta property="og:description" content="우리 아이와 닮은 보호소 친구가 가족을 기다리고 있어요. 사진은 내 폰 밖으로 나가지 않아요" />
    <meta property="og:url" content="%SITE_URL%find" />
    <meta property="og:image" content="%SITE_URL%og/og-800x400.jpg?v=%OG_IMAGE_VERSION%" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="우리 아이와 닮은 보호소 친구가 가족을 기다리고 있어요. 사진은 내 폰 밖으로 나가지 않아요" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>우리 아이 닮은 친구 찾기 · 고잉홈</title>
  </head>
  <body class="mk-page fd-page">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-5.5v-1a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v5m0-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 14.5a1.6 1.6 0 0 1 2.4-2.1L8 14"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    </svg>
    <!-- 상단 바: 메인과 같은 로고·글자 메뉴 (페이지마다 따로 놀지 않게) -->
    <header class="topbar site-top">
      <a class="brand" href="./" aria-label="고잉홈 첫 화면"><img class="brand-logo" src="/logo-goinghome.svg" alt="고잉홈" width="81" height="30" /></a>
      <span class="topbar-sp"></span>
      <nav class="text-menu site-menu" aria-label="메뉴"><a href="./">만나기</a><a href="adopt">전체 공고</a><a class="on" aria-current="page" href="find">닮은 친구</a></nav>
    </header>

    <main class="mk-wrap">
      <h1 class="sr-only">우리 아이 닮은 친구 찾기</h1>
      <!-- 1. 우리 아이 사진 한 장 (기기 안에서 털색과 생김새만 본다) -->
      <section id="fd-ask" class="fd-ask">
        <h2 class="fd-h">우리 아이랑 닮은 친구,<br />보호소에 있을까요?</h2>
        <p class="fd-sub">사진 한 장이면 생김새와 털색으로 찾아 드려요</p>

        <label class="fd-photo">
          <input id="fd-file" type="file" accept="image/*" />
          <img id="fd-preview" alt="우리 아이 사진" hidden />
          <span id="fd-pick-label" class="fd-photo-empty"><svg class="ico" aria-hidden="true"><use href="#i-camera" /></svg>사진 고르기</span>
        </label>
        <p id="fd-status" class="fd-status" aria-live="polite"></p>

        <div class="fd-form">
          <input id="fd-name" class="fd-name" maxlength="10" autocomplete="off" placeholder="이름 (선택) · 예: 보리" aria-label="이름 (선택)" />
          <div class="fd-species" role="radiogroup" aria-label="종류">
            <label><input type="radio" name="fd-species" value="dog" checked /><span>강아지</span></label>
            <label><input type="radio" name="fd-species" value="cat" /><span>고양이</span></label>
          </div>
        </div>

        <button id="fd-go" class="pill pill-primary fd-go" type="button" disabled>닮은 친구 찾기</button>
        <p class="fd-privacy"><svg class="ico" aria-hidden="true"><use href="#i-lock" /></svg>사진은 이 기기 안에서만 보고 바로 잊어요. 어디로도 보내지 않아요.</p>
      </section>

      <!-- 2. 결과: 우리 아이 문 · 닮은 친구 문 (둘 다 원본 사진을 아치문 모양으로) -->
      <section id="fd-result" class="fd-result" hidden>
        <div class="fd-doors">
          <figure><span class="fd-door"><img id="fd-me-img" alt="" /></span><figcaption><b id="fd-me-name">우리 아이</b>우리 집</figcaption></figure>
          <figure><a id="fd-top-link" class="fd-door"><img id="fd-top-img" alt="" referrerpolicy="no-referrer" /></a><figcaption><b id="fd-top-name"></b><span id="fd-top-meta"></span><span id="fd-top-where"></span></figcaption></figure>
        </div>
        <h3 id="fd-title" class="fd-title"></h3>
        <ul id="fd-why" class="fd-why"></ul>
        <!-- 이 친구 만나기: 공고 보기 · (실사화한 아이면) 쓰다듬어 보기, 그리고 알리기 -->
        <div class="fd-cta">
          <a id="fd-notice" class="pill pill-line"><span>입양 공고 보기</span><svg class="ico" aria-hidden="true"><use href="#i-right" /></svg></a>
          <a id="fd-pet" class="pill pill-line" hidden><svg class="ico" aria-hidden="true"><use href="#i-hand" /></svg><span>쓰다듬어 보기</span></a>
          <button id="fd-share" class="pill pill-primary fd-share" type="button"><svg class="ico" aria-hidden="true"><use href="#i-share" /></svg><span>친구에게 알려 주기</span></button>
        </div>
        <p id="fd-more-label" class="fd-more-label">다른 닮은 친구</p>
        <div id="fd-list" class="fd-more"></div>
        <button id="fd-again" class="fd-again" type="button">다른 사진으로 다시 찾기</button>
      </section>
    </main>

    <!-- 공유 포스터: 기기 안에서 그린 정사각 카드 미리보기 + 저장 · 공유 -->
    <dialog id="fd-poster" class="fd-poster" aria-labelledby="fd-poster-title">
      <h2 id="fd-poster-title" class="sr-only">공유 포스터</h2>
      <img id="fd-card" class="fd-card" alt="닮은 친구 공유 포스터" />
      <p class="fd-poster-hint">카톡·인스타 스토리에 맞는 정사각 이미지예요</p>
      <div class="fd-poster-cta">
        <a id="fd-save" class="pill pill-line" download="goinghome-닮은친구.png">이미지 저장</a>
        <button id="fd-send" class="pill pill-primary" type="button"><svg class="ico" aria-hidden="true"><use href="#i-share" /></svg><span>공유하기</span></button>
      </div>
      <button id="fd-poster-close" class="fd-again" type="button">닫기</button>
    </dialog>
    <!-- 휴대폰 하단 탭바 (앱처럼). PC는 상단 글자 메뉴 -->
<nav class="tabbar" aria-label="메뉴"><a href="./"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-5.5v-1a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v5m0-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 14.5a1.6 1.6 0 0 1 2.4-2.1L8 14"/></svg><span>만나기</span></a><a href="adopt"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>전체 공고</span></a><a href="find" class="on" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><span>닮은 친구</span></a></nav>
    <footer class="site-footer">© 2026 <a href="https://www.ricecookey.com" target="_blank" rel="noopener">RICECookey</a>.</footer>
    <script type="module" src="/src/find.ts"></script>
  </body>
</html>
